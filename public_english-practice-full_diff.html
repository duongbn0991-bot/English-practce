        function getTestQuestions(testId) {
            let filteredTopics = topics;
            if (testId === 'test-a2') filteredTopics = topics.filter(t => t.level === 'A2');
            else if (testId === 'test-b1') filteredTopics = topics.filter(t => t.level === 'B1');
            else if (testId === 'test-b1plus') filteredTopics = topics.filter(t => t.level === 'B1+');

            const allQ = [];
            filteredTopics.forEach(t => t.questions.forEach(q => allQ.push({...q})));

            if (testId === 'test-grammar') return allQ.filter(q => q.type === 'mc' || q.type === 'fb').sort(() => Math.random() - 0.5).slice(0, 20);
            else if (testId === 'test-skills') return allQ.filter(q => q.type === 'listen' || q.type === 'speak' || q.type === 'match').sort(() => Math.random() - 0.5).slice(0, 20);
            else return allQ.sort(() => Math.random() - 0.5).slice(0, 20);

        // ========== WRITING GRADER ==========
        function gradeWriting(text, prompt) {
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            const wordCount = words.length;
            const targetWords = prompt.wordCount;

            // Word count score (0-25)
            const wordRatio = wordCount / targetWords;
            let wordScore = 0;
            if (wordRatio >= 0.9 && wordRatio <= 1.2) wordScore = 25;
            else if (wordRatio >= 0.7 && wordRatio <= 1.4) wordScore = 20;
            else if (wordRatio >= 0.5) wordScore = 15;
            else wordScore = 10;

            // Grammar check (0-25)
            let grammarScore = 25;
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);

            // Check for basic grammar issues
            if (sentences.length > 0) {
                sentences.forEach(s => {
                    const trimmed = s.trim();
                    if (trimmed.length > 0) {
                        // Check capitalization
                        if (trimmed[0] !== trimmed[0].toUpperCase()) grammarScore -= 2;
                        // Check for double spaces
                        if (s.includes('  ')) grammarScore -= 1;
                    }
                });
            }

            // Check for common errors
            const lowerText = text.toLowerCase();
            if (lowerText.includes(' i ')) grammarScore -= 3; // lowercase 'i'
            if ((text.match(/\b\w+\b\s+\b\w+\b\s+\b\w+\b/g) || []).length === 0) grammarScore -= 5; // very short sentences

            grammarScore = Math.max(0, grammarScore);

            // Vocabulary score (0-25)
            const uniqueWords = new Set(words.map(w => w.toLowerCase()));
            const vocabularyRichness = uniqueWords.size / words.length;
            let vocabScore = 0;
            if (vocabularyRichness > 0.7) vocabScore = 25;
            else if (vocabularyRichness > 0.6) vocabScore = 20;
            else if (vocabularyRichness > 0.5) vocabScore = 15;
            else vocabScore = 10;

            // Check for good vocabulary
            const goodWords = ['because', 'however', 'although', 'therefore', 'moreover', 'furthermore', 'in addition', 'for example', 'such as', 'while', 'since', 'despite'];
            const usedGoodWords = goodWords.filter(w => lowerText.includes(w));
            vocabScore += Math.min(5, usedGoodWords.length);
            vocabScore = Math.min(25, vocabScore);

            // Structure score (0-25)
            let structureScore = 0;

            // Check for introduction
            if (sentences.length >= 3) structureScore += 5;

            // Check for linking words
            const linkingWords = ['first', 'second', 'third', 'finally', 'then', 'after that', 'in conclusion', 'to sum up', 'on the one hand', 'on the other hand'];
            const usedLinking = linkingWords.filter(w => lowerText.includes(w));
            structureScore += Math.min(10, usedLinking.length * 2);

            // Check for paragraphs (multiple sentences)
            if (sentences.length >= 5) structureScore += 5;
            if (sentences.length >= 8) structureScore += 5;

            structureScore = Math.min(25, structureScore);

            const totalScore = wordScore + grammarScore + vocabScore + structureScore;
            const percentage = Math.round((totalScore / 100) * 100);

            let grade = '', feedback = '', emoji = '';
            if (percentage >= 90) { grade = 'Xuất sắc'; emoji = '🏆'; feedback = 'Bài viết rất tốt! Bạn đã sử dụng từ vựng phong phú, ngữ pháp chính xác và cấu trúc rõ ràng.'; }
            else if (percentage >= 75) { grade = 'Giỏi'; emoji = '🌟'; feedback = 'Bài viết tốt! Hãy tiếp tục phát huy và chú ý thêm về cấu trúc bài viết.'; }
            else if (percentage >= 60) { grade = 'Khá'; emoji = '👍'; feedback = 'Bài viết khá ổn. Hãy cải thiện thêm về từ vựng và sử dụng nhiều từ nối hơn.'; }
            else if (percentage >= 45) { grade = 'Trung bình'; emoji = '📝'; feedback = 'Bài viết cần cải thiện. Hãy chú ý đến ngữ pháp, độ dài và cấu trúc bài viết.'; }
            else { grade = 'Cần cố gắng'; emoji = '💪'; feedback = 'Hãy viết lại bài này. Chú ý viết đủ số từ, sử dụng thì chính xác và thêm từ nối.'; }

            return {
                totalScore,
                percentage,
                grade,
                emoji,
                feedback,
                details: {
                    wordCount: { score: wordScore, target: targetWords, actual: wordCount },
                    grammar: { score: grammarScore, max: 25 },
                    vocabulary: { score: vocabScore, max: 25, unique: uniqueWords.size, goodWords: usedGoodWords },
                    structure: { score: structureScore, max: 25, sentences: sentences.length, linkingWords: usedLinking }
                },
                suggestions: []
            };
        }

            const [fill, setFill] = useState('');
            const [match, setMatch] = useState({});
            const [recorded, setRecorded] = useState(false);
            const [answers, setAnswers] = useState([]);
            const [timeLeft, setTimeLeft] = useState(test.duration * 60);
            const [showResult, setShowResult] = useState(false);

            const q = questions[qIdx];
            const total = questions.length;

            useEffect(() => {
                if (showResult) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [showResult]);

            useEffect(() => {
                if (timeLeft === 0 && !showResult) finishTest();
            }, [timeLeft]);

            const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

            const checkAnswer = () => {
                if (q.type === 'fb') return fill.trim().toLowerCase() === q.ans.toLowerCase();
                if (q.type === 'match') return q.left.every((l, i) => { const r = match[i]; return r !== undefined && q.ans.includes(`${l}-${q.right[r]}`); });
                if (q.type === 'speak') return recorded;
                return sel === q.ans;
            };

            const saveAnswer = () => {
                const correct = checkAnswer();
                setAnswers([...answers, { correct, q }]);
            };

            const next = () => {
                saveAnswer();
                if (qIdx < total - 1) {
                    setQIdx(qIdx + 1);
                    setSel(null); setFill(''); setMatch({}); setRecorded(false);
                } else {
                    finishTest();
                }
            };

            const finishTest = () => {
                if (answers.length < qIdx + 1) saveAnswer();
                setShowResult(true);
                const finalAnswers = answers.length >= total ? answers : [...answers.slice(0, qIdx), { correct: checkAnswer(), q }];
                const score = finalAnswers.filter(a => a.correct).length;
                onComplete(test.id, score, total);
            };

            const canCheck = () => {
                if (q.type === 'mc' || q.type === 'listen') return sel !== null;
                if (q.type === 'fb') return fill.trim().length > 0;
                if (q.type === 'match') return q.left.every((_, i) => match[i] !== undefined);
                if (q.type === 'speak') return recorded;
                return false;
            };

            const play = () => {
                if (!q.audio || !window.speechSynthesis) return;
                const u = new SpeechSynthesisUtterance(q.audio);
                u.lang = 'en-US'; u.rate = 0.9;
                speechSynthesis.speak(u);
            };

            if (showResult) {
                const score = answers.filter(a => a.correct).length;
                const pct = Math.round((score / total) * 100);
                const timeUsed = test.duration * 60 - timeLeft;
                let grade = '', emoji = '', color = '';
                if (pct >= 90) { grade = 'Xuất sắc'; emoji = '🏆'; color = 'text-yellow-500'; }
                else if (pct >= 75) { grade = 'Giỏi'; emoji = '🌟'; color = 'text-green-500'; }
                else if (pct >= 60) { grade = 'Khá'; emoji = '👍'; color = 'text-blue-500'; }
                else if (pct >= 45) { grade = 'Trung bình'; emoji = '📝'; color = 'text-orange-500'; }
                else { grade = 'Cần cải thiện'; emoji = '💪'; color = 'text-red-500'; }

                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 py-8 px-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                                <div className="text-6xl mb-4">{emoji}</div>
                                <h2 className="text-3xl font-bold mb-2">Kết quả kiểm tra</h2>
                                <p className="text-gray-500 mb-6">{test.title}</p>
                                <div className={`text-6xl font-bold ${color} mb-2`}>{score}/{total}</div>
                                <div className={`text-xl font-semibold ${color} mb-4`}>{grade} ({pct}%)</div>
                                <div className="w-full bg-gray-200 rounded-full h-4 mb-6">
                                    <div className={`h-4 rounded-full ${pct >= 75 ? 'bg-green-500' : pct >= 60 ? 'bg-blue-500' : pct >= 45 ? 'bg-orange-500' : 'bg-red-500'}`} style={{width: `${pct}%`}}></div>
                                </div>
                                <div className="grid grid-cols-3 gap-4 mb-6">
                                    <div className="bg-blue-50 rounded-xl p-3">
                                        <div className="text-2xl font-bold text-blue-700">{score}</div>
                                        <div className="text-xs text-blue-600">Đúng</div>
                                    </div>
                                    <div className="bg-red-50 rounded-xl p-3">
                                        <div className="text-2xl font-bold text-red-700">{total - score}</div>
                                        <div className="text-xs text-red-600">Sai</div>
                                    </div>
                                    <div className="bg-purple-50 rounded-xl p-3">
                                        <div className="text-2xl font-bold text-purple-700">{formatTime(timeUsed)}</div>
                                        <div className="text-xs text-purple-600">Thời gian</div>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={onBack} className="flex-1 px-6 py-3 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200">← Về danh sách</button>
                                    <button onClick={onBack} className="flex-1 px-6 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">Làm bài khác 🔄</button>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl shadow-sm p-6">
                                <h3 className="text-xl font-bold mb-4">📋 Chi tiết từng câu</h3>
                                <div className="space-y-4">
                                    {answers.map((ans, idx) => (
                                        <div key={idx} className={`p-4 rounded-xl border-2 ${ans.correct ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`}>
                                            <div className="flex items-start gap-3">
                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${ans.correct ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>{idx + 1}</span>
                                                <div className="flex-1">
                                                    <p className="font-medium mb-1">{ans.q.q}</p>
                                                    {!ans.correct && (
                                                        <div className="text-sm">
                                                            {(ans.q.type === 'mc' || ans.q.type === 'listen') && <p className="text-red-700">Đáp án đúng: <strong>{ans.q.opts?.[ans.q.ans]}</strong></p>}
                                                            {ans.q.type === 'fb' && <p className="text-red-700">Đáp án đúng: <strong>{ans.q.ans}</strong></p>}
                                                            {ans.q.exp && <p className="text-gray-600 mt-1">💡 {ans.q.exp}</p>}
                                                        </div>
                                                    )}
                                                    {ans.correct && ans.q.exp && <p className="text-sm text-green-700">💡 {ans.q.exp}</p>}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
                    <div className="bg-white shadow-sm border-b sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto px-4 py-4">
                            <div className="flex justify-between mb-3">
                                <button onClick={() => { if (confirm('Thoát? Tiến độ sẽ mất.')) onBack(); }} className="text-gray-600">← Thoát</button>
                                <div className={`flex items-center gap-2 px-4 py-2 rounded-full font-bold ${timeLeft < 60 ? 'bg-red-100 text-red-700 animate-pulse' : timeLeft < 300 ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                                    <span>⏱️</span>
                                    <span>{formatTime(timeLeft)}</span>
                                </div>
                                <span className="text-sm text-gray-500">{qIdx+1}/{total}</span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-2">
                                <div className="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" style={{width: `${((qIdx+1)/total)*100}%`}}></div>
                            </div>
                        </div>
                    </div>
                    <div className="max-w-3xl mx-auto px-4 py-8">
                        <div className="bg-white rounded-2xl shadow-sm border p-6 md:p-8">
                            <div className="flex items-center gap-2 mb-4">
                                <span className={`px-3 py-1 rounded-full text-xs font-medium ${q.type === 'mc' ? 'bg-blue-100 text-blue-700' : q.type === 'fb' ? 'bg-green-100 text-green-700' : q.type === 'match' ? 'bg-purple-100 text-purple-700' : q.type === 'listen' ? 'bg-orange-100 text-orange-700' : 'bg-pink-100 text-pink-700'}`}>
                                    {q.type === 'mc' ? '✅ Chọn đáp án' : q.type === 'fb' ? '✍️ Điền từ' : q.type === 'match' ? '🔗 Nối từ' : q.type === 'listen' ? '🎧 Nghe hiểu' : '🗣️ Nói'}
                                </span>
                            </div>
                            {q.type === 'listen' && q.audio && (
                                <div className="bg-orange-50 border border-orange-100 rounded-xl p-5 mb-6">
                                    <div className="flex items-center gap-2 mb-3">
                                        <span className="text-xl">🎧</span>
                                        <span className="font-semibold text-orange-800">Bài nghe</span>
                                    </div>
                                    <button onClick={play} className="px-5 py-2.5 bg-orange-500 text-white rounded-xl font-medium hover:bg-orange-600">▶ Nghe</button>
                                </div>
                            )}
                            <h2 className="text-xl font-bold text-gray-800 mb-6">{q.q}</h2>
                            {(q.type === 'mc' || q.type === 'listen') && q.opts && (
                                <div className="space-y-3">
                                    {q.opts.map((o, i) => (
                                        <button key={i} onClick={() => setSel(i)} className={`w-full text-left p-4 rounded-xl border-2 ${i === sel ? 'border-blue-400 bg-blue-50' : 'border-gray-200 hover:border-blue-300'}`}>
                                            <div className="flex items-center gap-3">
                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${i === sel ? 'bg-blue-500 text-white' : 'bg-gray-100'}`}>{String.fromCharCode(65+i)}</span>
                                                <span className="text-gray-700 font-medium">{o}</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}
                            {q.type === 'fb' && (
                                <input type="text" value={fill} onChange={e => setFill(e.target.value)} placeholder="Nhập câu trả lời..." className="w-full p-4 rounded-xl border-2 border-gray-200 text-lg focus:border-blue-400 outline-none" />
                            )}
                            {q.type === 'match' && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        {q.left.map((l, i) => (
                                            <div key={i} className={`p-3 rounded-xl border-2 ${match[i] !== undefined ? 'border-blue-400 bg-blue-50' : 'border-gray-200'}`}>
                                                <span className="font-medium">{l}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="space-y-2">
                                        {q.left.map((_, i) => (
                                            <select key={i} value={match[i] ?? ''} onChange={e => setMatch({...match, [i]: parseInt(e.target.value)})} className="w-full p-3 rounded-xl border-2 border-gray-200 bg-white">
                                                <option value="">-- Chọn --</option>
                                                {q.right.map((r, ri) => <option key={ri} value={ri}>{r}</option>)}
                                            </select>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {q.type === 'speak' && (
                                <div className="space-y-4">
                                    {q.prompt && <div className="bg-pink-50 border border-pink-100 rounded-xl p-4"><p className="text-sm text-gray-700">{q.prompt}</p></div>}
                                    <div className="bg-gray-50 rounded-xl p-5 border">
                                        <button onClick={() => setRecorded(true)} className="px-5 py-2.5 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600">🎤 Ghi âm (demo)</button>
                                        {recorded && <p className="mt-3 text-sm text-green-600">✓ Đã ghi âm!</p>}
                                    </div>
                                </div>
                            )}
                            <div className="mt-8 flex justify-end">
                                <button onClick={next} disabled={!canCheck()} className="px-8 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 disabled:opacity-50 shadow-lg">
                                    {qIdx < total - 1 ? 'Câu tiếp →' : 'Nộp bài 🎯'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
 
        function ExercisePage({ topic, onComplete, onBack }) {
            const [qIdx, setQIdx] = useState(0);
            const [sel, setSel] = useState(null);
            const [fill, setFill] = useState('');
            const [match, setMatch] = useState({});
            const [answered, setAnswered] = useState(false);
            const [score, setScore] = useState(0);
            const [answers, setAnswers] = useState([]);
            const [showResult, setShowResult] = useState(false);
            const [recorded, setRecorded] = useState(false);

            const q = topic.questions[qIdx];
            const total = topic.questions.length;

            const check = () => {
                let ok = false;
                if (q.type === 'fb') ok = fill.trim().toLowerCase() === q.ans.toLowerCase();
                else if (q.type === 'match') ok = q.left.every((l, i) => { const r = match[i]; return r !== undefined && q.ans.includes(`${l}-${q.right[r]}`); });
                else if (q.type === 'speak') ok = recorded;
                else ok = sel === q.ans;
                if (ok) setScore(score + 1);
                setAnswers([...answers, ok]);
                setAnswered(true);
            };

            const next = () => {
                if (qIdx < total - 1) {
                    setQIdx(qIdx + 1);
                    setSel(null); setFill(''); setMatch({}); setAnswered(false); setRecorded(false);
                } else {
                    setShowResult(true);
                    onComplete(topic.id, score);
                }
            };

            const canCheck = () => {
                if (q.type === 'mc' || q.type === 'listen') return sel !== null;
                if (q.type === 'fb') return fill.trim().length > 0;
                if (q.type === 'match') return q.left.every((_, i) => match[i] !== undefined);
                if (q.type === 'speak') return recorded;
                return false;
            };

            const play = () => {
                if (!q.audio || !window.speechSynthesis) return;
                const u = new SpeechSynthesisUtterance(q.audio);
                u.lang = 'en-US'; u.rate = 0.9;
                speechSynthesis.speak(u);
            };

            if (showResult) {
                const pct = Math.round((score/total)*100);
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-4">{pct >= 70 ? '🏆' : pct >= 50 ? '🌟' : '💪'}</div>
                            <h2 className="text-2xl font-bold mb-2">Kết quả</h2>
                            <div className={`text-5xl font-bold mb-4 ${pct >= 70 ? 'text-green-500' : pct >= 50 ? 'text-blue-500' : 'text-orange-500'}`}>{score}/{total}</div>
                            <div className="w-full bg-gray-200 rounded-full h-4 mb-6">
                                <div className={`h-4 rounded-full ${pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-blue-500' : 'bg-orange-500'}`} style={{width: `${pct}%`}}></div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={onBack} className="flex-1 px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Về</button>
                                <button onClick={() => {setQIdx(0); setScore(0); setAnswers([]); setShowResult(false);}} className="flex-1 px-6 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">Làm lại 🔄</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
                    <div className="bg-white shadow-sm border-b sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto px-4 py-4">
                            <div className="flex justify-between mb-3">
                                <button onClick={onBack} className="text-gray-600">← Quay lại</button>
                                <div className="flex gap-3">
                                    <span className="text-sm text-gray-500">{qIdx+1}/{total}</span>
                                    <span className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold">⭐ {score}</span>
                                </div>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-2">
                                <div className="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" style={{width: `${((qIdx+1)/total)*100}%`}}></div>
                            </div>
                        </div>
                    </div>
                    <div className="max-w-3xl mx-auto px-4 py-8">
                        <div className="bg-white rounded-2xl shadow-sm border p-6 md:p-8">
                            <div className="flex items-center gap-2 mb-6">
                                <span className="text-2xl">{topic.icon}</span>
                                <span className="text-sm font-medium text-gray-500">{topic.title}</span>
                            </div>
                            {q.type === 'listen' && q.audio && (
                                <div className="bg-orange-50 border border-orange-100 rounded-xl p-5 mb-6">
                                    <div className="flex items-center gap-2 mb-3">
                                        <span className="text-xl">🎧</span>
                                        <span className="font-semibold text-orange-800">Bài nghe</span>
                                    </div>
                                    <button onClick={play} className="px-5 py-2.5 bg-orange-500 text-white rounded-xl font-medium hover:bg-orange-600">▶ Nghe</button>
                                </div>
                            )}
                            <h2 className="text-xl font-bold text-gray-800 mb-6">{q.q}</h2>
                            {(q.type === 'mc' || q.type === 'listen') && q.opts && (
                                <div className="space-y-3">
                                    {q.opts.map((o, i) => (
                                        <button key={i} onClick={() => !answered && setSel(i)} disabled={answered} className={`w-full text-left p-4 rounded-xl border-2 ${answered ? (i === q.ans ? 'border-green-400 bg-green-50' : i === sel ? 'border-red-400 bg-red-50' : 'border-gray-200 opacity-50') : i === sel ? 'border-blue-400 bg-blue-50' : 'border-gray-200 hover:border-blue-300'}`}>
                                            <div className="flex items-center gap-3">
                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${i === sel ? 'bg-blue-500 text-white' : 'bg-gray-100'}`}>{String.fromCharCode(65+i)}</span>
                                                <span className="text-gray-700 font-medium">{o}</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}
                            {q.type === 'fb' && (
                                <input type="text" value={fill} onChange={e => setFill(e.target.value)} disabled={answered} placeholder="Nhập câu trả lời..." className="w-full p-4 rounded-xl border-2 border-gray-200 text-lg focus:border-blue-400 outline-none" />
                            )}
                            {q.type === 'match' && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        {q.left.map((l, i) => (
                                            <div key={i} className={`p-3 rounded-xl border-2 ${match[i] !== undefined ? 'border-blue-400 bg-blue-50' : 'border-gray-200'}`}>
                                                <span className="font-medium">{l}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="space-y-2">
                                        {q.left.map((_, i) => (
                                            <select key={i} value={match[i] ?? ''} onChange={e => setMatch({...match, [i]: parseInt(e.target.value)})} disabled={answered} className="w-full p-3 rounded-xl border-2 border-gray-200 bg-white">
                                                <option value="">-- Chọn --</option>
                                                {q.right.map((r, ri) => <option key={ri} value={ri}>{r}</option>)}
                                            </select>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {q.type === 'speak' && (
                                <div className="space-y-4">
                                    {q.prompt && <div className="bg-pink-50 border border-pink-100 rounded-xl p-4"><p className="text-sm text-gray-700">{q.prompt}</p></div>}
                                    <div className="bg-gray-50 rounded-xl p-5 border">
                                        <button onClick={() => setRecorded(true)} className="px-5 py-2.5 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600">🎤 Ghi âm (demo)</button>
                                        {recorded && <p className="mt-3 text-sm text-green-600">✓ Đã ghi âm!</p>}
                                    </div>
                                </div>
                            )}
                            {answered && q.exp && (
                                <div className="mt-6 p-4 rounded-xl border bg-yellow-50 border-yellow-200">
                                    <p className="text-sm text-gray-700">💡 {q.exp}</p>
                                </div>
                            )}
                            <div className="mt-8 flex justify-end">
                                {!answered ? (
                                    <button onClick={check} disabled={!canCheck()} className="px-8 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 disabled:opacity-50">Kiểm tra ✓</button>
                                ) : (
                                    <button onClick={next} className="px-8 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">{qIdx < total - 1 ? 'Câu tiếp →' : 'Xem kết quả 🎯'}</button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
